name: ci
on: [push, pull_request]
jobs:
  continuous_integration:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v5
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python3 -m pytest
